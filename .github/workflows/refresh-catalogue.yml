name: refresh organisation catalogue
on:
  schedule: [{ cron: "17 5 * * 1" }]   # Mondays 05:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Rebuild the snapshot from GSoC, LFX, CNCF and Apache
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: python -m backend.catalogue refresh --snapshot
      - name: Commit if it changed (this redeploys the site)
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add mentor/catalogue_snapshot.json
          git diff --cached --quiet || (git commit -m "Refresh organisation catalogue snapshot" && git push)
