    <p><strong>Your first open-source contribution—with understanding, not guesswork.</strong></p>
    <p>OSS Mentor helps a student find a GitHub issue that is genuinely still available (live checks for assignees, competing pull requests, claim comments and contribution/AI policies), understand the surrounding code, and prepare a contribution they can explain. It will not mark a contribution ready until the student passes an understanding checkpoint generated from their actual diff.</p>
    <p>The interactive app needs JavaScript. Everything it does is described without it:</p>

<script>
// Tiny no-build loader: each .jsx is a self-contained component (React only). We transpile it in the browser,
// give it React + hooks, and turn `export default X` into a return value.
const HOOKS = ['useState','useEffect','useRef','useMemo','useCallback'];
async function loadJsx(name) {
  // no-cache = revalidate (a cheap 304 via ETag): without it a browser can keep serving old components after an update,
  // mixing old and new files that no longer agree with each other or with the API
  const src = await (await fetch(`/static/v2/${name}.jsx`, { cache: 'no-cache' })).text();
  const js = Babel.transform(src.replace(/^import[^\n]*\n/gm, ''), { presets: ['react'], filename: name + '.jsx' }).code
    .replace('export default ', 'return ');
  return new Function('React', ...HOOKS, js)(React, ...HOOKS.map(h => React[h]));
}
(async () => {
  try {
    const names = ['HeroSection','InterviewStep','MatchPodium','DiscoverPanel','BrowseCatalogue','ScoutProgress','IssueBoard','FullAutoJob','ProfilePage','ContributionReview','WorkspaceView','RepliesInbox','app'];
    const loaded = await Promise.all(names.map(loadJsx));
    window.OSS = Object.fromEntries(names.map((n, i) => [n, loaded[i]]));
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.OSS.app));
  } catch (e) {
    document.getElementById('root').innerHTML = '<p style="padding:40px;font-weight:700">Could not start the app: ' + String(e.message).replace(/</g,'&lt;') + '</p>';
    console.error(e);
  }
})();
</script>
